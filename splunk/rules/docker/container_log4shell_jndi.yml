title: Docker Container Log4Shell JNDI Injection Attempt
id: 9f3b7d52-1a48-4c86-b0e5-d4a6c8e21f73
logsource:
    product: docker
    category: container_logs
detection:
    selection:
        line|contains:
            - '${jndi:'
            - '$%7Bjndi:'
            - '%24%7Bjndi:'
            - 'jndi:ldap'
            - 'jndi:rmi'
            - 'jndi:dns'
    condition: selection
level: critical
