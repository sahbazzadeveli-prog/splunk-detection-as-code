title: Web Shell Activity Detected in Web Server Requests
id: 22222222-3333-4444-5555-666666666661
status: stable
description: Detects web shell access in web server logs through known web shell filenames, script execution from upload directories, or command strings in the request path.
references:
    - https://attack.mitre.org/techniques/T1505/003/
author: Sənin adın
date: 2026/09/28
tags:
    - attack.persistence
    - attack.t1505.003
    - attack.initial_access
logsource:
    category: webserver
detection:
    selection_known_shells:
        path|contains:
            - 'c99.php'
            - 'r57.php'
            - 'wso.php'
            - 'b374k'
            - 'shell.php'
            - 'cmd.aspx'
    selection_cmd_in_path:
        path|contains:
            - 'cmd='
            - 'exec='
            - 'whoami'
            - '/bin/sh'
            - 'cmd.exe'
            - 'powershell'
    selection_upload_exec:
        method:
            - 'GET'
            - 'POST'
        status: 200
        path|contains:
            - '/uploads/'
            - '/upload/'
            - '/tmp/'
        path|endswith:
            - '.php'
            - '.aspx'
            - '.jsp'
    condition: 1 of selection_*
falsepositives:
    - Legitimate admin tools or vulnerability scanners
level: high
