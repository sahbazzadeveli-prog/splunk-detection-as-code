title: Brute Force Login Attempts
id: 7c1f3a52-9d84-4e6b-b3a1-2f5e8d90c417
status: experimental
description: Login endpoint-inə uğursuz cəhdlərin çoxluğu (brute force / credential stuffing).
author: Veli Sahbazzade
date: 2026/09/28
tags:
  - attack.credential_access
  - attack.t1110
logsource:
  category: webserver
detection:
  selection_path:
    path|contains:
      - '/login'
      - '/signin'
      - '/auth'
  selection_status:
    status:
      - 401
      - 403
  condition: selection_path and selection_status
falsepositives:
  - Parolunu unudan istifadəçilər
level: high
