title: HTTP Method Abuse or Unauthorized Method Detection
id: f83a2b1c-7e4d-4a12-9c3f-8b9a1e2f3d4e
status: experimental
description: Detects unusual or potentially dangerous HTTP methods.
logsource:
    category: web_server
detection:
    selection:
        * :
            - 'PUT *'
            - 'DELETE *'
            - 'TRACE *'
            - 'CONNECT *'
            - 'PROPFIND *'
    condition: selection
level: medium
