title: Directory Traversal Attempt in URI
id: 22222222-3333-4444-5555-666666666662
logsource:
    category: webserver
detection:
    selection:
        c-uri|contains:
            - '../'
            - '..%2f'
            - '..%5c'
            - '/etc/passwd'
            - 'boot.ini'
    condition: selection
level: high
