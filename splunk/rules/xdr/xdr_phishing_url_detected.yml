title: Phishing URL Detected on Endpoint by XDR
id: 33333333-4444-5555-6666-777777777772
status: stable
description: Detects a new XDR incident where the endpoint agent identified a phishing URL. Indicates a user attempted to visit a malicious link, which may lead to credential theft or malware delivery.
references:
    - https://attack.mitre.org/techniques/T1566/
    - https://attack.mitre.org/techniques/T1204/001/
author: Veli Shahbazzada
date: 2026/09/28
tags:
    - attack.initial_access
    - attack.t1566
    - attack.execution
    - attack.t1204.001
logsource:
    category: endpoint
    product: xdr
detection:
    selection:
        module: 'new-incident'
        detection_name|contains: 'Phishing'
    condition: selection
falsepositives:
    - Security awareness training with simulated phishing links
    - Internal phishing simulation campaigns
level: high
